name: Desktop app on Linux and macOS
# Scratch check for PR #84: build the Tauri desktop crate on Linux and macOS.
# No Rust tests run (parity freeze).
on:
  push:
    branches: ['ci/desktop-platforms']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/tauri/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev
      - name: Root crate fmt and clippy
        run: |
          cargo fmt --all --check
          cargo clippy --locked -- -D warnings
          cargo clippy --locked --no-default-features -- -D warnings
      - name: Frontend
        working-directory: desktop/tauri
        run: |
          npm ci
          npm run build
      - name: Desktop crate fmt and clippy
        working-directory: desktop/tauri/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
      - name: Release build
        working-directory: desktop/tauri
        run: npx tauri build --no-bundle
      - name: Starts without crashing
        if: runner.os == 'Linux'
        working-directory: desktop/tauri/src-tauri/target/release
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          export MODSYNC_SETTINGS_DIR="$RUNNER_TEMP/settings"
          code=0; timeout 20 xvfb-run -a ./modsync-desktop-tauri || code=$?
          echo "exit $code (124 means it was still running after 20 s)"
          test "$code" = 124
      - name: Starts without crashing
        if: runner.os == 'macOS'
        working-directory: desktop/tauri/src-tauri/target/release
        run: |
          export MODSYNC_SETTINGS_DIR="$RUNNER_TEMP/settings"
          ./modsync-desktop-tauri & pid=$!
          sleep 20
          kill -0 $pid && echo "still running after 20 s"
          kill $pid
      - uses: actions/upload-artifact@v4
        with:
          name: modsync-desktop-${{ runner.os }}
          path: desktop/tauri/src-tauri/target/release/modsync-desktop-tauri
